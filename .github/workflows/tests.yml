name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libsdl2-dev liblua5.4-dev libgl1-mesa-dev xvfb xauth
      - name: Test geometry and scene operations
        run: make test
      - name: Build editor and integration tests
        run: make -j2 engine test-integration
      - name: Smoke test editor
        run: timeout 30s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 ./engine
