name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make cmake libsdl2-dev liblua5.4-dev libgl1-mesa-dev libegl1-mesa-dev xvfb xauth ffmpeg
      - name: Test geometry and scene operations
        run: make test
      - name: Build editor and integration tests
        run: KEEP_TEST_GLB=1 make -j2 engine test-integration
      - name: Test Studio MCP and audio codecs
        run: python tools/test_studio_mcp.py ./engine && python tools/test_studio_audio.py
      - name: Test self-contained game and relocated resources
        run: |
          LUNORYX_GAME_GUI=1 LUNORYX_GAME_SMOKE=1 SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 LUNORYX_CAPTURE_PATH="$PWD/build/game-linux.png" python3 tools/test_game_package.py ./engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Validate binary glTF independently
        run: npm ci --prefix tools --ignore-scripts && node tools/validate_glb.cjs tests/test-scene.glb && node tools/validate_glb.cjs tests/textured.glb
      - name: Smoke test editor and timeout
        run: |
          mkdir -p build
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_UI_SMOKE=1 LUNORYX_CAPTURE_PATH=build/studio-smoke.png ./engine
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_GIZMO_SMOKE=1 LUNORYX_CAPTURE_PATH=build/gizmo-smoke.png ./engine
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/modeling.png ./engine --report-modeling
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/uv.png ./engine --report-uv
      - uses: actions/upload-artifact@v4
        with:
          name: gltf-validation
          path: |
            tests/test-scene.glb.validation.json
            build/studio-smoke.png
            build/gizmo-smoke.png
            build/modeling.png
            build/uv.png
            build/game-linux.png
      - name: Address, undefined behavior and leak checks
        run: |
          make clean
          make -j2 test-integration EXTRA_CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  mingw:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++-mingw-w64-x86-64
      - name: Prepare verified Lua and SDL2 dependencies
        run: bash tools/prepare_mingw.sh
      - name: Build editor and Windows tests
        run: make -j2 -f Makefile.win package && python tools/verify_windows.py build/win/engine.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lua3d-windows-x64
          path: |
            build/win/*.exe
            build/win/README.md
            build/win/examples/
            build/win/docs/
            build/win/licenses/
  windows:
    runs-on: windows-2022
    needs: mingw
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lua3d-windows-x64
      - name: Run MinGW binaries on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          & ./modeling_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./engine_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_studio_mcp.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import wave,math,struct; f=wave.open('tests/tone.wav','wb'); f.setparams((1,2,22050,0,'NONE','not compressed')); f.writeframes(b''.join(struct.pack('<h',int(math.sin(i*.1)*12000)) for i in range(11025))); f.close()"
          $env:LUNORYX_AUDIO_NULL='1'
          & ./studio_audio_tests.exe tests/tone.wav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare verified software OpenGL for Windows GUI tests
        shell: pwsh
        run: ./tools/prepare_windows_mesa.ps1
      - name: Test native game packaging and complete the level on Windows
        shell: pwsh
        run: |
          $env:LUNORYX_GAME_GUI='1'
          $env:LUNORYX_GAME_SMOKE='1'
          $env:GALLIUM_DRIVER='llvmpipe'
          $env:LUNORYX_CAPTURE_PATH=Join-Path $PWD 'build/game-windows.png'
          python tools/test_game_package.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: lunoryx-game-demo
          path: |
            build/GemTrail.exe
            build/game-windows.png
